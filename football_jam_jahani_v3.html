<!DOCTYPE html><html lang="fa" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>فوتبال جام جهانی</title><style>*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#102018;font-family:Tahoma,Arial}body{touch-action:none}#game{position:fixed;inset:0;overflow:hidden;background:#16833f}canvas{position:absolute;inset:0;width:100%;height:100%;display:block}.panel{position:absolute;z-index:30;inset:0;background:linear-gradient(#102018f2,#172b22f2);display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;text-align:center;padding:20px}.panel h1{font-size:32px;margin:0 0 10px}.panel p{margin:5px 0 14px}.options{display:flex;flex-wrap:wrap;justify-content:center;gap:9px;max-width:520px}button{border:0;border-radius:14px;padding:12px 18px;font:700 16px Tahoma;cursor:pointer}.country{background:#263b5d;color:#fff;min-width:120px}.country.selected{outline:3px solid #ffd166;background:#405f8d}.difficulty{background:#394b59;color:#fff}.difficulty.selected{background:#f16666;outline:3px solid #fff}#startButton{margin-top:18px;background:#ffd166;color:#111;font-size:20px;min-width:190px}#score{position:absolute;top:10px;left:50%;transform:translateX(-50%);z-index:5;color:#fff;background:#111b;padding:8px 18px;border-radius:15px;font-size:21px;font-weight:bold;direction:ltr}#msg{position:absolute;top:55px;left:50%;transform:translateX(-50%);z-index:5;color:#fff;font-size:15px;text-align:center;white-space:nowrap}#difficultyInfo{position:absolute;top:88px;right:12px;z-index:5;color:#fff;background:#0008;padding:5px 9px;border-radius:8px;font-size:12px}#joystick,#joystick2{position:absolute;bottom:25px;left:25px;width:135px;height:135px;border-radius:50%;background:#ffffff33;border:3px solid #ffffff66;z-index:10}#joystick2{left:auto;right:25px}#stick,#stick2{position:absolute;width:58px;height:58px;border-radius:50%;background:#ffffffaa;border:3px solid white;left:50%;top:50%;transform:translate(-50%,-50%)}#kick,#kick2{position:absolute;bottom:40px;right:35px;width:115px;height:115px;border:0;border-radius:50%;background:#d62828;color:#fff;font-size:20px;font-weight:bold;z-index:10;box-shadow:0 6px 0 #8b1515}#kick2{right:auto;left:35px;background:#1d70d6;box-shadow:0 6px 0 #124b91}#kick:active,#kick2:active{transform:translateY(5px);box-shadow:0 1px 0 #8b1515}#restart{display:none;position:absolute;z-index:20;top:50%;left:50%;transform:translate(-50%,-50%);padding:15px 30px;background:#ffd166;font-size:20px;font-weight:bold}.hidden{display:none!important}</style></head><body><div id="game"><canvas id="canvas"></canvas><div id="menu" class="panel"><h1>🏆 فوتبال جام جهانی ⚽</h1><p>تیم خودت را انتخاب کن</p><div class="options" id="countries"><button class="country selected" data-country="iran">🇮🇷 ایران</button><button class="country" data-country="brazil">🇧🇷 برزیل</button><button class="country" data-country="germany">🇩🇪 آلمان</button><button class="country" data-country="france">🇫🇷 فرانسه</button><button class="country" data-country="argentina">🇦🇷 آرژانتین</button><button class="country" data-country="japan">🇯🇵 ژاپن</button></div><p style="margin-top:16px">تیم حریف را انتخاب کن</p><div class="options" id="opponents"><button class="country selected" data-opponent="brazil">🇧🇷 برزیل</button><button class="country" data-opponent="germany">🇩🇪 آلمان</button><button class="country" data-opponent="france">🇫🇷 فرانسه</button><button class="country" data-opponent="argentina">🇦🇷 آرژانتین</button><button class="country" data-opponent="japan">🇯🇵 ژاپن</button></div><p style="margin-top:16px">حالت بازی</p><div class="options" id="modes"><button class="difficulty selected" data-mode="single">تک‌نفره 🤖</button><button class="difficulty" data-mode="two">دو نفره 👥</button></div><p style="margin-top:16px">درجه سختی</p><div class="options" id="difficulties"><button class="difficulty" data-level="easy">آسان</button><button class="difficulty selected" data-level="normal">متوسط</button><button class="difficulty" data-level="hard">سخت 🔥</button></div><button id="startButton">شروع بازی 🎮</button></div><div id="score">🇮🇷 ۰ - ۰ 🔵</div><div id="msg">کشور و درجه سختی را انتخاب کن</div><div id="difficultyInfo">متوسط</div><div id="joystick"><div id="stick"></div></div><div id="joystick2" class="hidden"><div id="stick2"></div></div><button id="kick">شوت ⚽</button><button id="kick2" class="hidden">شوت ۲ ⚽</button><button id="restart">منوی اصلی</button></div><script>
const canvas=document.getElementById('canvas'),ctx=canvas.getContext('2d');let W=innerWidth,H=innerHeight,dpr=devicePixelRatio||1;function resize(){dpr=devicePixelRatio||1;canvas.width=innerWidth*dpr;canvas.height=innerHeight*dpr;canvas.style.width=innerWidth+'px';canvas.style.height=innerHeight+'px';ctx.setTransform(dpr,0,0,dpr,0,0);W=innerWidth;H=innerHeight}addEventListener('resize',resize);resize();const scoreEl=document.getElementById('score'),msg=document.getElementById('msg'),menu=document.getElementById('menu'),restart=document.getElementById('restart'),diffInfo=document.getElementById('difficultyInfo'),stick=document.getElementById('stick'),joystick=document.getElementById('joystick'),joystick2=document.getElementById('joystick2'),stick2=document.getElementById('stick2'),kick2Btn=document.getElementById('kick2');const countries={iran:{flag:'🇮🇷',player:'#e63946'},brazil:{flag:'🇧🇷',player:'#f4c20d'},germany:{flag:'🇩🇪',player:'#222'},france:{flag:'🇫🇷',player:'#277da1'},argentina:{flag:'🇦🇷',player:'#74c0e8'},japan:{flag:'🇯🇵',player:'#e63946'}};const levels={easy:{name:'آسان',enemy:1.00,player:.75},normal:{name:'متوسط',enemy:1.00,player:.75},hard:{name:'سخت',enemy:1.00,player:.75}};let selectedCountry='iran',selectedOpponent='brazil',selectedLevel='normal',selectedMode='single',playerScore=0,enemyScore=0,gameStarted=false,gameOver=false,timeLeft=90,last=performance.now(),goalLock=0,playerStun=0,kickLock=0;const player={x:.25,y:.5,r:22,speed:.75,angle:0},enemy={x:.75,y:.5,r:22,speed:1.00},ball={x:.5,y:.5,r:10,vx:0,vy:0},input={x:0,y:0},input2={x:0,y:0};function fa(n){return String(n).replace(/\d/g,d=>'۰۱۲۳۴۵۶۷۸۹'[d])}function updateScore(){const c=countries[selectedCountry],o=countries[selectedOpponent];scoreEl.textContent=`${c.flag} ${fa(playerScore)} - ${fa(enemyScore)} ${o.flag}`}function resetPositions(){player.x=.25;player.y=.5;player.angle=0;enemy.x=.75;enemy.y=.5;ball.x=.5;ball.y=.5;ball.vx=0;ball.vy=0}function startGame(){playerScore=0;enemyScore=0;timeLeft=90;gameOver=false;gameStarted=true;kickLock=0;input.x=0;input.y=0;input2.x=0;input2.y=0;player.speed=levels[selectedLevel].player;enemy.speed=levels[selectedLevel].enemy;diffInfo.textContent=levels[selectedLevel].name;updateScore();resetPositions();playerStun=0;menu.classList.add('hidden');restart.style.display='none';joystick2.classList.toggle('hidden',selectedMode!=='two');kick2Btn.classList.toggle('hidden',selectedMode!=='two');msg.textContent=selectedMode==='two'?'دو نفره شروع شد! هر نفر با جوی‌استیک و دکمه شوت بازی می‌کند ⚽':'بازی شروع شد! توپ را بگیر و شوت کن ⚽'}function goal(pg){if(!gameStarted||gameOver||performance.now()<goalLock)return;goalLock=performance.now()+1000;if(pg){playerScore++;msg.textContent='🎉 گل زدی!'}else{enemyScore++;msg.textContent='😱 حریف گل زد!'}updateScore();resetPositions()}function kick(){if(!gameStarted||gameOver)return;const dx=ball.x-player.x,dy=ball.y-player.y,d=Math.hypot(dx,dy);if(d>.105){msg.textContent='به توپ نزدیک‌تر شو!';return}let x=Math.cos(player.angle),y=Math.sin(player.angle);if(Math.hypot(input.x,input.y)>.1){x=input.x;y=input.y}const l=Math.hypot(x,y)||1;x/=l;y/=l;ball.vx=x*2.15;ball.vy=y*2.15;kickLock=.18;msg.textContent='💥 شوت در حال دویدن!'}function clamp(v,a,b){return Math.max(a,Math.min(b,v))}function update(dt){if(!gameStarted||gameOver)return;playerStun=0;kickLock=Math.max(0,kickLock-dt);timeLeft-=dt;if(timeLeft<=0){timeLeft=0;gameOver=true;msg.textContent=playerScore>enemyScore?'🏆 بردی!':playerScore<enemyScore?'😢 حریف برد!':'🤝 مساوی شد!';restart.style.display='block';return}player.x+=input.x*player.speed*dt;player.y+=input.y*player.speed*dt;player.x=clamp(player.x,.035,.965);player.y=clamp(player.y,.075,.925);if(Math.hypot(input.x,input.y)>.05)player.angle=Math.atan2(input.y,input.x);if(selectedMode==='two'){const p2l=Math.hypot(input2.x,input2.y);if(p2l>.01){enemy.x+=input2.x/p2l*enemy.speed*dt;enemy.y+=input2.y/p2l*enemy.speed*dt}enemy.x=clamp(enemy.x,.035,.965);enemy.y=clamp(enemy.y,.075,.925)}const edy=ball.y-enemy.y;const ex=ball.x-enemy.x;let enemyMoveSpeed=selectedMode==='two'?0:enemy.speed;if(Math.hypot(ball.x-enemy.x,ball.y-enemy.y)<.07){enemyMoveSpeed=enemy.speed}else if(Math.hypot(ball.vx,ball.vy)<.01&&Math.hypot(ex,edy)<.2){enemyMoveSpeed=enemy.speed}enemy.y+=clamp(edy,-1,1)*enemyMoveSpeed*dt;enemy.x+=clamp(ex,-1,1)*enemyMoveSpeed*dt;enemy.x=clamp(enemy.x,.035,.965);enemy.y=clamp(enemy.y,.075,.925);const pex=player.x-enemy.x,pey=player.y-enemy.y,ped=Math.hypot(pex,pey);if(ped<.075){const nx=ped>.0001?pex/ped:1,ny=ped>.0001?pey/ped:0;const overlap=.075-ped;player.x=clamp(player.x+nx*overlap*.55,.035,.965);player.y=clamp(player.y+ny*overlap*.55,.075,.925);enemy.x=clamp(enemy.x-nx*overlap*.50,.035,.965);enemy.y=clamp(enemy.y-ny*overlap*.50,.075,.925);if(selectedMode==='single'&&selectedLevel==='hard'&&ped<.055){ball.vx=nx*.78;ball.vy=ny*.78}}let dx=ball.x-player.x,dy=ball.y-player.y,d=Math.hypot(dx,dy);if(d<.065&&kickLock<=0){const nx=d>.0001?dx/d:Math.cos(player.angle),ny=d>.0001?dy/d:Math.sin(player.angle);ball.x=player.x+nx*.065;ball.y=player.y+ny*.065;if(Math.hypot(input.x,input.y)>.05){ball.vx=input.x*.38;ball.vy=input.y*.38}}dx=ball.x-enemy.x;dy=ball.y-enemy.y;d=Math.hypot(dx,dy);if(d<.065){const nx=d>.0001?dx/d:1,ny=d>.0001?dy/d:0;ball.x=enemy.x+nx*.065;ball.y=enemy.y+ny*.065;ball.vx=-1.55;ball.vy=(Math.random()-.5)*.75}ball.x+=ball.vx*dt;ball.y+=ball.vy*dt;ball.vx*=Math.pow(.025,dt);ball.vy*=Math.pow(.025,dt);if(ball.y<.025){ball.y=.025;ball.vy=Math.abs(ball.vy)*.72}if(ball.y>.975){ball.y=.975;ball.vy=-Math.abs(ball.vy)*.72}const gt=.38,gb=.62;if(ball.x<-.018&&ball.y>gt&&ball.y<gb){goal(false);return}if(ball.x>1.018&&ball.y>gt&&ball.y<gb){goal(true);return}if(ball.x<.015&&(ball.y<gt||ball.y>gb)){ball.x=.015;ball.vx=Math.abs(ball.vx)*.8}if(ball.x>.985&&(ball.y<gt||ball.y>gb)){ball.x=.985;ball.vx=-Math.abs(ball.vx)*.8}}
function draw(){
ctx.clearRect(0,0,W,H);
// grass gradient
const grass=ctx.createLinearGradient(0,0,0,H);grass.addColorStop(0,'#1b9a4b');grass.addColorStop(.5,'#16833f');grass.addColorStop(1,'#0f7137');ctx.fillStyle=grass;ctx.fillRect(0,0,W,H);
// subtle pitch stripes
for(let i=0;i<10;i++){ctx.fillStyle=i%2?'#ffffff08':'#00000008';ctx.fillRect(i*W/10,0,W/10,H)}
// field markings
ctx.strokeStyle='#ffffffdd';ctx.lineWidth=3;ctx.strokeRect(8,8,W-16,H-16);ctx.beginPath();ctx.moveTo(W/2,8);ctx.lineTo(W/2,H-8);ctx.stroke();ctx.beginPath();ctx.arc(W/2,H/2,Math.min(W,H)*.12,0,Math.PI*2);ctx.stroke();ctx.beginPath();ctx.arc(W/2,H/2,4,0,Math.PI*2);ctx.fillStyle='#fff';ctx.fill();
ctx.strokeRect(0,H*.28,W*.15,H*.44);ctx.strokeRect(W*.85,H*.28,W*.15,H*.44);ctx.strokeRect(0,H*.36,W*.08,H*.28);ctx.strokeRect(W*.92,H*.36,W*.08,H*.28);
ctx.fillStyle='#eee';ctx.fillRect(0,H*.38,15,H*.24);ctx.fillRect(W-15,H*.38,15,H*.24);
// shadows
ctx.fillStyle='#00000035';ctx.beginPath();ctx.ellipse(ball.x*W+3,ball.y*H+5,ball.r*1.1,ball.r*.55,0,0,Math.PI*2);ctx.fill();
ctx.beginPath();ctx.ellipse(player.x*W+4,player.y*H+7,player.r*1.05,player.r*.45,0,0,Math.PI*2);ctx.fill();
ctx.beginPath();ctx.ellipse(enemy.x*W+4,enemy.y*H+7,enemy.r*1.05,enemy.r*.45,0,0,Math.PI*2);ctx.fill();
// ball
ctx.beginPath();ctx.arc(ball.x*W,ball.y*H,ball.r+2,0,Math.PI*2);ctx.fillStyle='#222';ctx.fill();ctx.beginPath();ctx.arc(ball.x*W,ball.y*H,ball.r,0,Math.PI*2);const bg=ctx.createRadialGradient(ball.x*W-3,ball.y*H-4,1,ball.x*W,ball.y*H,ball.r);bg.addColorStop(0,'#fff');bg.addColorStop(1,'#d9d9d9');ctx.fillStyle=bg;ctx.fill();ctx.strokeStyle='#333';ctx.lineWidth=1.5;ctx.stroke();
// player
ctx.beginPath();ctx.arc(player.x*W,player.y*H,player.r+3,0,Math.PI*2);ctx.fillStyle='#ffffff55';ctx.fill();ctx.beginPath();ctx.arc(player.x*W,player.y*H,player.r,0,Math.PI*2);const pg=ctx.createRadialGradient(player.x*W-7,player.y*H-8,2,player.x*W,player.y*H,player.r);pg.addColorStop(0,'#ffffff88');pg.addColorStop(.25,countries[selectedCountry].player);pg.addColorStop(1,'#111');ctx.fillStyle=pg;ctx.fill();ctx.strokeStyle='#fff';ctx.lineWidth=3;ctx.stroke();ctx.fillStyle='#fff';ctx.font='bold 14px Arial';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('۱',player.x*W,player.y*H);
// enemy
ctx.beginPath();ctx.arc(enemy.x*W,enemy.y*H,enemy.r+3,0,Math.PI*2);ctx.fillStyle='#ffffff55';ctx.fill();ctx.beginPath();ctx.arc(enemy.x*W,enemy.y*H,enemy.r,0,Math.PI*2);const eg=ctx.createRadialGradient(enemy.x*W-7,enemy.y*H-8,2,enemy.x*W,enemy.y*H,enemy.r);eg.addColorStop(0,'#ffffff88');eg.addColorStop(.25,'#277da1');eg.addColorStop(1,'#102b48');ctx.fillStyle=eg;ctx.fill();ctx.strokeStyle='#fff';ctx.lineWidth=3;ctx.stroke();ctx.fillStyle='#fff';ctx.fillText('۲',enemy.x*W,enemy.y*H);
// timer badge
ctx.fillStyle='#00000070';ctx.beginPath();ctx.roundRect(W/2-65,67,130,34,12);ctx.fill();ctx.font='bold 16px Tahoma';ctx.fillStyle='#fff';ctx.fillText('زمان: '+fa(Math.ceil(timeLeft)),W/2,84);
if(gameOver){ctx.fillStyle='#0009';ctx.fillRect(0,0,W,H);ctx.fillStyle='#fff';ctx.font='bold 38px Tahoma';ctx.fillText('پایان بازی',W/2,H*.45);ctx.font='bold 26px Tahoma';ctx.fillText(fa(playerScore)+' - '+fa(enemyScore),W/2,H*.52)}}
function loop(now){const dt=Math.min((now-last)/1000,.033);last=now;update(dt);draw();requestAnimationFrame(loop)}requestAnimationFrame(loop);document.querySelectorAll('#countries .country').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('#countries .country').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');selectedCountry=b.dataset.country;if(selectedCountry===selectedOpponent){selectedOpponent=selectedCountry==='iran'?'brazil':'iran';document.querySelectorAll('#opponents .country').forEach(x=>x.classList.toggle('selected',x.dataset.opponent===selectedOpponent))}updateScore()}));document.querySelectorAll('#opponents .country').forEach(b=>b.addEventListener('click',()=>{if(b.dataset.opponent===selectedCountry){msg.textContent='تیم حریف نمی‌تواند همان تیم شما باشد!';return}document.querySelectorAll('#opponents .country').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');selectedOpponent=b.dataset.opponent;updateScore()}));document.querySelectorAll('.difficulty').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('.difficulty').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');selectedLevel=b.dataset.level;diffInfo.textContent=levels[selectedLevel].name}));document.querySelectorAll('#modes .difficulty').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('#modes .difficulty').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');selectedMode=b.dataset.mode;msg.textContent=selectedMode==='two'?'دو نفره: بازیکن ۱ با جوی‌استیک، بازیکن ۲ با IJKL و Enter بازی می‌کند.':'حالت تک‌نفره انتخاب شد'}));document.getElementById('startButton').onclick=startGame;restart.addEventListener('click',()=>{menu.classList.remove('hidden');restart.style.display='none';gameStarted=false;joystick2.classList.add('hidden');kick2Btn.classList.add('hidden');input2.x=0;input2.y=0;msg.textContent='کشور و درجه سختی را انتخاب کن'});let dragging=false,dragging2=false;function joystickMove(e){const r=joystick.getBoundingClientRect();let x=e.clientX-(r.left+r.width/2),y=e.clientY-(r.top+r.height/2);const max=r.width/2-29,d=Math.hypot(x,y);if(d>max){x=x/d*max;y=y/d*max}input.x=x/max;input.y=y/max;stick.style.left=`calc(50% + ${x}px)`;stick.style.top=`calc(50% + ${y}px)`}function joystickMove2(e){const r=joystick2.getBoundingClientRect();let x=e.clientX-(r.left+r.width/2),y=e.clientY-(r.top+r.height/2);const max=r.width/2-29,d=Math.hypot(x,y);if(d>max){x=x/d*max;y=y/d*max}input2.x=x/max;input2.y=y/max;stick2.style.left=`calc(50% + ${x}px)`;stick2.style.top=`calc(50% + ${y}px)`}joystick.addEventListener('pointerdown',e=>{dragging=true;joystick.setPointerCapture(e.pointerId);joystickMove(e)});joystick.addEventListener('pointermove',e=>{if(dragging)joystickMove(e)});joystick2.addEventListener('pointerdown',e=>{dragging2=true;joystick2.setPointerCapture(e.pointerId);joystickMove2(e)});joystick2.addEventListener('pointermove',e=>{if(dragging2)joystickMove2(e)});function joystickStop(){dragging=false;input.x=0;input.y=0;stick.style.left='50%';stick.style.top='50%'}function joystickStop2(){dragging2=false;input2.x=0;input2.y=0;stick2.style.left='50%';stick2.style.top='50%'}joystick.addEventListener('pointerup',joystickStop);joystick.addEventListener('pointercancel',joystickStop);joystick2.addEventListener('pointerup',joystickStop2);joystick2.addEventListener('pointercancel',joystickStop2);document.getElementById('kick').addEventListener('pointerdown',kick);function kick2(){if(selectedMode!=='two'||!gameStarted||gameOver)return;const dx=ball.x-enemy.x,dy=ball.y-enemy.y,d=Math.hypot(dx,dy);if(d>.105){msg.textContent='بازیکن ۲ به توپ نزدیک‌تر شو!';return}let x=Math.cos(Math.atan2(input2.y,input2.x)),y=Math.sin(Math.atan2(input2.y,input2.x));if(Math.hypot(input2.x,input2.y)<.1){x=ball.x<enemy.x?-1:1;y=0}else{const l=Math.hypot(input2.x,input2.y);x=input2.x/l;y=input2.y/l}ball.vx=x*3.6;ball.vy=y*3.6;kickLock=.18;msg.textContent='💥 بازیکن ۲ شوت زد!'}kick2Btn.addEventListener('pointerdown',kick2);const keys={};addEventListener('keydown',e=>{keys[e.key]=true;if(e.code==='Space')kick();if(e.code==='Enter')kick2()});addEventListener('keyup',e=>keys[e.key]=false);setInterval(()=>{if(!gameStarted)return;if(!dragging){let x=0,y=0;if(keys.ArrowLeft||keys.a)x--;if(keys.ArrowRight||keys.d)x++;if(keys.ArrowUp||keys.w)y--;if(keys.ArrowDown||keys.s)y++;const l=Math.hypot(x,y);if(l){input.x=x/l;input.y=y/l;player.angle=Math.atan2(input.y,input.x)}else if(selectedMode==='single'){input.x=0;input.y=0}}if(selectedMode==='two'&&!dragging2){let x=0,y=0;if(keys.j)x--;if(keys.l)x++;if(keys.i)y--;if(keys.k)y++;const l=Math.hypot(x,y);if(l){input2.x=x/l;input2.y=y/l}}},16);updateScore();
</script></body></html>
